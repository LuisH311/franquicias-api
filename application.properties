spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/franquicias}
spring.datasource.username=${DB_USER:franquicias}
spring.datasource.password=${DB_PASSWORD:franquicias123}

# Las tablas se crean al INICIAR la API, nunca al compilar.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=always
